name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.project }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - agentguard
          - agenttrace
          - agentsec-scorecard
          - agentsec-bench
          - criticalagent-blueprints
          - agentsec-crosswalk
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: uv sync

      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: uv run pytest -v

      - name: Run scenario validation
        if: matrix.project == 'agentsec-bench'
        working-directory: agentsec-bench
        run: uv run python scripts/check_scenarios.py