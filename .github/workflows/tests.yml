name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install all local projects
        run: uv sync --frozen

      - name: Run all project tests
        run: uv run python scripts/agentsec.py test

      - name: Validate scenarios and run deterministic demos
        run: |
          uv run python scripts/agentsec.py validate
          uv run python scripts/agentsec.py demo
          uv run python scripts/agentsec.py blueprints